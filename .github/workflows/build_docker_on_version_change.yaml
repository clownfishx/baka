name: Build docker on version change

on:
  push:
    branches:
      - main
    paths:
      - '**/version.yaml'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            base="HEAD^"
          else
            base=$(git hash-object -t tree /dev/null)
          fi

          changed=$(git diff --name-only "$base" HEAD -- '*/version.yaml' || true)

          include="[]"
          if [ -n "$changed" ]; then
            entries=()
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              dir=$(dirname "$file")
              version=$(awk '/^version:/ {gsub(/["'\'' ]/, "", $2); print $2; exit}' "$file")
              if [ -z "$version" ]; then
                echo "::warning::Skipping $file — no version field found"
                continue
              fi
              entries+=("{\"dir\":\"$dir\",\"version\":\"$version\"}")
            done <<< "$changed"

            if [ ${#entries[@]} -gt 0 ]; then
              include="[$(IFS=,; echo "${entries[*]}")]"
            fi
          fi

          if [ "$include" = "[]" ]; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "Changed: $include"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.dir }}
          file: ./${{ matrix.dir }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            clownfishx/baka-${{ matrix.dir }}:${{ matrix.version }}
            clownfishx/baka-${{ matrix.dir }}:latest
