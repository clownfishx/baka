services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"

  backup:
    build: .
    environment:
      BUCKET_PREFIX: testing
      DATABASE_USER: admin
      DATABASE_PASSWORD: adminpassword
      DATABASE_HOST: mongodb
      DATABASE_PORT: 27017
      AWS_BUCKET: estx
      AWS_ACCESS_KEY_ID: estx
      AWS_SECRET_ACCESS_KEY: estx
      STORAGE_CLASS: ONEZONE_IA
      IGNORE_DATABASES: database_default,database_default2
